name: Build

# Build otomatis di mesin macOS GitHub → pengguna tinggal unduh .app jadi
# (tidak perlu Xcode Command Line Tools di Mac sendiri).
# Rilis otomatis: naikkan CFBundleShortVersionString di Resources/Info.plist, lalu merge ke main.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # versi rilis = CFBundleShortVersionString di Info.plist → tag v<versi>
      - name: Baca versi
        id: ver
        run: |
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # server (Go, tanpa dependensi): tes lalu binary Linux untuk VPS
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Tes & build server
        working-directory: server
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::jalankan gofmt -w ."; exit 1; }
          go vet ./...
          go test -race -count=1 ./...
          mkdir -p ../dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o ../dist/pastelan-server-linux-$arch .
          done

      - name: Build PasteLAN.app (universal)
        run: ARCH=universal ./scripts/build.sh

      # izin firewall (koneksi masuk) hanya bertahan antar-versi kalau designated requirement tidak memakai cdhash
      - name: Cek designated requirement
        run: |
          codesign -d -r- build/PasteLAN.app 2>&1 | tee /dev/stderr \
            | grep -q 'designated => identifier "id.local.pastelan"$'

      - name: Buat installer & zip
        run: |
          ./scripts/make-installer.sh
          ditto -c -k --keepParent build/PasteLAN.app dist/PasteLAN.zip
          (cd dist && zip -q install-PasteLAN.zip install-PasteLAN.command)

      # tanda tangan Ed25519 untuk auto-update (lihat scripts/sign-release.swift). Hanya saat rilis.
      # Secret belum diatur → rilis tetap jalan tanpa .sig, aplikasi lalu mengarahkan ke halaman rilis (unduh manual).
      - name: Tanda tangani PasteLAN.zip
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || steps.ver.outputs.exists == 'false')
        env:
          PASTELAN_SIGNING_KEY: ${{ secrets.PASTELAN_SIGNING_KEY }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
        run: |
          if [ -z "$PASTELAN_SIGNING_KEY" ]; then
            echo "::warning::Secret PASTELAN_SIGNING_KEY belum diatur → rilis tanpa tanda tangan (auto-update nonaktif)"
            exit 0
          fi
          swift scripts/sign-release.swift sign dist/PasteLAN.zip "$TAG" > dist/PasteLAN.zip.sig

      - uses: actions/upload-artifact@v4
        with:
          name: PasteLAN
          path: |
            dist/PasteLAN.zip
            dist/install-PasteLAN.zip
            dist/pastelan-server-linux-*

      - name: Rilis (kalau push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PasteLAN.zip
            dist/PasteLAN.zip.sig
            dist/install-PasteLAN.zip
            dist/pastelan-server-linux-amd64
            dist/pastelan-server-linux-arm64

      # merge ke main dengan versi baru (tag belum ada) → tag + rilis dibuat otomatis
      - name: Rilis otomatis (push ke main, versi belum dirilis)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PasteLAN ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/PasteLAN.zip
            dist/PasteLAN.zip.sig
            dist/install-PasteLAN.zip
            dist/pastelan-server-linux-amd64
            dist/pastelan-server-linux-arm64
